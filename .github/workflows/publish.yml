name: publish

# Publishes to PyPI via Trusted Publishing (OIDC) when a GitHub release is
# published. No API token is stored anywhere: the id-token permission lets
# PyPI verify this exact workflow. Cut a release whose tag matches the version
# in pyproject.toml (e.g. v0.1.0) to publish.
on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
