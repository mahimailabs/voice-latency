name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q
      - name: data.json is in sync with data.py
        run: |
          voice-latency export --out data.json
          if ! git diff --exit-code -- data.json; then
            echo "::error::data.json is out of date. Run: voice-latency export --out data.json"
            exit 1
          fi
